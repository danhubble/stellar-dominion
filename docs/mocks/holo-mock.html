<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sector holo mock — Frontier</title>
<style>
:root{--bg:#04050d;--txt:#dde5ff;--mut:#8390bd;--dim:#5a6693;--cy:#48e2ff;--gr:#5ce6a5;--rd:#ff6b8a;--line:rgba(96,142,255,.20)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,sans-serif;overflow:hidden}
#chips{display:flex;gap:6px;padding:10px 12px 0}
#chips span{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;font:700 9px/1 system-ui;letter-spacing:.14em;color:var(--dim)}
#chips span.on{border-color:var(--cy);color:var(--cy);background:rgba(72,226,255,.10)}
#wrap{position:relative;margin:10px 12px 0;aspect-ratio:1/1;max-height:52vh;border:1px solid rgba(72,226,255,.25);border-radius:14px;overflow:hidden;background:#04050d}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{display:flex;gap:6px;margin:8px 12px 0}
#bar b{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 0;font:700 11px/1.3 system-ui;color:var(--mut)}
#bar b i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.12em;color:var(--dim);margin-top:2px}
#bar b:first-child{color:var(--cy)}
#ctl{display:flex;gap:6px;flex-wrap:wrap;margin:12px}
#ctl button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);border-radius:7px;padding:6px 10px;font:600 11px/1 system-ui}
#ctl button.on{border-color:var(--cy);color:var(--cy);background:rgba(72,226,255,.10)}
</style></head><body>
<div id="chips"><span>CORE</span><span>INNER REACH</span><span class="on">FRONTIER</span><span>THE DEEP</span><span>BEYOND</span></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="bar"><b>1<i>AT ANVILREACH</i></b><b>2<i>AT SOL REACH</i></b><b>3<i>LOCKED LV 22</i></b></div>
<div id="ctl"><button id="tint" class="on">one colour</button><button id="flick" class="on">flicker</button><button id="spin" class="on">spin</button></div>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1);
const SYSS=[
 {id:"thu",n:"Thule",kind:"ice",sx:24,sy:22,state:"free",lv:33},
 {id:"anv",n:"Anvilreach",kind:"ore",sx:78,sy:34,state:"held",lv:31},
 {id:"wra",n:"Wraithe",kind:"ice",sx:14,sy:64,state:"free",lv:35},
 {id:"cal",n:"Caldera",kind:"rock",sx:46,sy:86,state:"rival",rv:"HELION REACH",lv:41},
];
const LANES=[["thu","wra"],["wra","cal"],["cal","anv"],["thu","anv"]];
let oneColour=true,flicker=true,spin=true,last=performance.now(),rot=0;
const KC={ice:'#9fd8ff',ore:'#ffb45c',rock:'#c7b299',gas:'#ffd166',belt:'#8fb8ff',void:'#a878ff',mixed:'#5ce6a5'};
function col(s,a){ // hologram: one cyan, or a per-kind tint
  const base=oneColour?'72,226,255':(s.state==="held"?'92,230,165':s.state==="rival"?'255,107,138':hexToRgb(KC[s.kind]));
  return `rgba(${base},${a})`}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255)}
function build(){const r=cv.getBoundingClientRect();W=Math.round(r.width*DPR);H=Math.round(r.height*DPR);cv.width=W;cv.height=H;for(const s of SYSS){s.x=s.sx/100*W;s.y=s.sy/100*H}}
/* wireframe globe: outline + latitude ellipses + a few longitude arcs, rotating */
function globe(x,y,R,c,ph,tilt){ctx.save();ctx.translate(x,y);ctx.rotate(tilt);
  // fill glow
  const g=ctx.createRadialGradient(0,0,R*.2,0,0,R*1.6);g.addColorStop(0,c(.16));g.addColorStop(.6,c(.05));g.addColorStop(1,c(0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R*1.6,0,7);ctx.fill();
  ctx.lineWidth=1.1*DPR;ctx.strokeStyle=c(.85);ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
  ctx.strokeStyle=c(.6);ctx.lineWidth=1*DPR;
  for(const f of [-.6,-.3,0,.3,.6]){const ry=R*Math.sqrt(1-f*f);ctx.beginPath();ctx.ellipse(0,f*R,ry,ry*.28,0,0,7);ctx.stroke()}
  for(let i=0;i<4;i++){const a=ph+i*Math.PI/4;const rx=Math.abs(Math.cos(a))*R;if(rx<1)continue;ctx.globalAlpha=.25+.6*Math.abs(Math.cos(a));ctx.beginPath();ctx.ellipse(0,0,rx,R,0,0,7);ctx.stroke();ctx.globalAlpha=1}
  // terminator shade
  const sh=ctx.createLinearGradient(-R,0,R,0);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=sh;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
  ctx.restore()}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(spin)rot+=dt*.4;const t=now/1000;
  ctx.fillStyle='#04050d';ctx.fillRect(0,0,W,H);
  // projection base: faint radial grid from bottom centre, like a table projector
  const cy='rgba(72,226,255,';const u=DPR;
  ctx.strokeStyle=cy+'.07)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=W;x+=W/10){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<=H;y+=H/10){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  // scanlines + a slow vertical flicker band
  ctx.fillStyle='rgba(0,0,0,.16)';for(let y=0;y<H;y+=3*u)ctx.fillRect(0,y,W,1*u);
  if(flicker){const by=(t*60*u)%(H+80*u)-40*u;const g=ctx.createLinearGradient(0,by-40*u,0,by+40*u);g.addColorStop(0,cy+'0)');g.addColorStop(.5,cy+'.07)');g.addColorStop(1,cy+'0)');ctx.fillStyle=g;ctx.fillRect(0,by-40*u,W,80*u)}
  const by=id=>SYSS.find(s=>s.id===id);
  // lanes: dashed, animated flow toward held systems
  for(const [a,b] of LANES){const A=by(a),B=by(b);const held=A.state==="held"||B.state==="held";
    ctx.strokeStyle=held?'rgba(92,230,165,.7)':cy+'.45)';if(oneColour)ctx.strokeStyle=cy+(held?'.8)':'.4)');
    ctx.lineWidth=1.2*u;ctx.setLineDash([5*u,7*u]);ctx.lineDashOffset=-(t*20*u)%(12*u);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.setLineDash([]);}
  for(const s of SYSS){const R=(s.state==="held"?19:15)*u;const c=a=>col(s,a);
    globe(s.x,s.y,R,c,rot*(1+s.sx/100),.35);
    if(s.state==="held"){ctx.strokeStyle=c(.7);ctx.lineWidth=1*u;ctx.setLineDash([3*u,3*u]);ctx.beginPath();ctx.ellipse(s.x,s.y,R*1.7,R*.5,-.35,0,7);ctx.stroke();ctx.setLineDash([]);
      for(let i=0;i<3;i++){const a=t*.6+i*2.1,x=Math.cos(a)*R*1.7,y=Math.sin(a)*R*.5;ctx.fillStyle=c(.95);ctx.beginPath();ctx.arc(s.x+x*Math.cos(-.35)-y*Math.sin(-.35),s.y+x*Math.sin(-.35)+y*Math.cos(-.35),1.5*u,0,7);ctx.fill()}}
    if(s.state==="rival"){ctx.strokeStyle='rgba(255,107,138,.85)';ctx.lineWidth=1*u;ctx.setLineDash([2*u,4*u]);ctx.beginPath();ctx.arc(s.x,s.y,R*1.5,0,7);ctx.stroke();ctx.setLineDash([]);
      // hazard ticks
      for(let i=0;i<8;i++){const a=i*Math.PI/4+t*.3;ctx.beginPath();ctx.moveTo(s.x+Math.cos(a)*R*1.5,s.y+Math.sin(a)*R*1.5);ctx.lineTo(s.x+Math.cos(a)*R*1.8,s.y+Math.sin(a)*R*1.8);ctx.stroke()}}
    // label: name + one status line, monospace, offset away from centre
    const right=s.x<W*.5,tx=right?s.x+R+8*u:s.x-R-8*u;ctx.textAlign=right?'left':'right';
    ctx.font=`700 ${9.5*u}px ui-monospace,monospace`;ctx.fillStyle=oneColour?'#dff6ff':(s.state==="held"?'#5ce6a5':s.state==="rival"?'#ffb3c2':'#dde5ff');ctx.fillText(s.n.toUpperCase(),tx,s.y-1*u);
    ctx.font=`600 ${7.5*u}px ui-monospace,monospace`;ctx.fillStyle=s.state==="rival"?'rgba(255,107,138,.9)':c(.75);
    ctx.fillText(s.state==="held"?'HELD · 3 SATS':s.state==="rival"?s.rv:s.kind.toUpperCase()+' · LV '+s.lv,tx,s.y+9*u);
  }
  // fleet marker
  const A=by("anv");ctx.strokeStyle=cy+'.95)';ctx.lineWidth=1.5*u;ctx.beginPath();ctx.moveTo(A.x+22*u,A.y-30*u);ctx.lineTo(A.x+28*u,A.y-18*u);ctx.lineTo(A.x+16*u,A.y-18*u);ctx.closePath();ctx.stroke();ctx.fillStyle='#dff6ff';ctx.font=`800 ${8*u}px ui-monospace,monospace`;ctx.textAlign='center';ctx.fillText('1',A.x+22*u,A.y-33*u);
  // exit + footer
  ctx.font=`700 ${8*u}px ui-monospace,monospace`;ctx.textAlign='right';ctx.fillStyle=cy+'.8)';ctx.fillText('THE DEEP →',W-10*u,H*.34);
  ctx.textAlign='left';ctx.fillStyle=cy+'.5)';ctx.fillText('SECTOR 03 · FRONTIER',10*u,H-8*u);
  requestAnimationFrame(frame)}
build();requestAnimationFrame(frame);addEventListener('resize',build);
document.getElementById('tint').onclick=e=>{oneColour=!oneColour;e.target.classList.toggle('on',oneColour);e.target.textContent=oneColour?'one colour':'kind colours'};
document.getElementById('flick').onclick=e=>{flicker=!flicker;e.target.classList.toggle('on',flicker)};
document.getElementById('spin').onclick=e=>{spin=!spin;e.target.classList.toggle('on',spin)};
})();
</script></body></html>
